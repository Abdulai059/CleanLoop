version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Osm8080aN
      POSTGRES_DB: plastico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleanloop-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:Osm8080aN@postgres:5432/plastico?schema=public
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-ultra-secure-refresh-secret-key-here}
      JWT_REFRESH_EXPIRES_IN: 90d
      JWT_COOKIE_EXPIRES_IN: 15m
      AT_API_KEY: ${AT_API_KEY:-your-africas-talking-api-key}
      AT_USERNAME: sandbox
      AT_SENDER_ID: SandboxShortCode
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && node -r dotenv/config dist/server.js"

volumes:
  postgres_data:
