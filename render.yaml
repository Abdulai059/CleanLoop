services:
  - type: web
    name: cleanloop-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: cleanloop-db
          property: connectionString
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false

databases:
  - name: cleanloop-db
    databaseName: plastico
    user: plastico_user
    plan: free
